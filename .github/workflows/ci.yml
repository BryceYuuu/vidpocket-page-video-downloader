name: Test

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Run tests
        run: npm test

      - name: Build Chrome Web Store package
        run: npm run package:store

      - name: Verify package archive
        run: |
          archive=$(find dist -maxdepth 1 -name 'vidpocket-*.zip' -print -quit)
          test -n "$archive"
          unzip -t "$archive"
